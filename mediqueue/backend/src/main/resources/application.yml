server:
  port: 8080

spring:
  application:
    name: mediqueue-backend

  # MySQL Operational Relational Database
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:mediqueue_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:mediqueue}
    password: ${MYSQL_PASSWORD:mediqueue_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  # MongoDB Document Analytics Store
  data:
    mongodb:
      host: ${MONGO_HOST:127.0.0.1}
      port: ${MONGO_PORT:27017}
      database: ${MONGO_DATABASE:mediqueue_mongo}

mediqueue:
  pipeline:
    script-path: /mnt/c/5 TH SEMESTER/Anti_Big/mediqueue/pipeline/run_stage2.sh
    data-dir: /mnt/c/5 TH SEMESTER/Anti_Big/mediqueue/pipeline/extractor/data/raw

logging:
  level:
    root: INFO
    com.mediqueue: DEBUG
    org.springframework.web: INFO
